# checkov settings for `mise run lint`. No checks are skipped here: every suppression is
# a #checkov:skip comment on its resource, with its reason (see docs/exceptions.md).
# skip-download only stops checkov fetching Prisma Cloud metadata. Remote modules are
# scanned by a separate, report-only pass in scripts/lint.sh.
framework:
  - terraform
compact: true
quiet: true
skip-download: true
