# kthw-on-floci tasks. `mise tasks` lists them; `mise run <task>` runs one.
# The default target is floci. Set KTHW_TARGET=aws to run the same roots against
# real AWS with your own credentials (see README).

[tools]
terraform = "1.15.8"
tflint = "0.64.0"
"pipx:checkov" = "3.3.29"

[env]
KTHW_TARGET = "{{ env.KTHW_TARGET | default(value='floci') }}"

[tasks.doctor]
description = "Check this machine can run floci's KTHW machines"
run = "scripts/doctor.sh"

[tasks.images]
description = "Build the floci, Debian 12 guest and console images"
run = [
  "scripts/floci-image.sh",
  "docker build -q -t kthw/ami-debian12:dev image",
  "docker compose -f floci/compose.yaml --profile console build -q console",
]

[tasks.up]
description = "Start floci (and the instances it already has)"
depends = ["images"]
run = "scripts/up.sh"

[tasks.down]
description = "Stop floci; instances stop with it and keep their disks"
# stop, not down: down deletes floci's Docker network, which the instances stay attached to
run = "docker compose -f floci/compose.yaml stop"

[tasks.bootstrap]
description = "Create the Terraform state bucket and its KMS key (local state)"
run = "scripts/tf.sh bootstrap apply"

[tasks.baseline]
description = "Apply the account security baseline (CloudTrail, Config, GuardDuty, Security Hub)"
run = "scripts/tf.sh account-baseline apply"

[tasks.apply]
description = "Create (or update) the KTHW machines, and wait until lab 3's root SSH works"
run = "scripts/apply.sh"

[tasks.plan]
description = "Show what would change; exits 2 when the workload drifted"
run = "scripts/tf.sh workload plan -detailed-exitcode"

[tasks.destroy]
description = "Delete the KTHW machines (the state bucket stays)"
run = "scripts/tf.sh workload destroy"

[tasks.console]
description = "Open a shell with the AWS CLI and SSH, pointed at the target (floci by default)"
run = 'c=console; [ "$KTHW_TARGET" != aws ] || c=console-aws; docker compose -f floci/compose.yaml --profile $c run --no-deps --rm $c'

[tasks.connect]
description = "SSH to the jumpbox through the EC2 Instance Connect Endpoint"
run = "scripts/connect.sh"

[tasks."test:kthw"]
description = "Run all of Kubernetes The Hard Way on the machines and check the result"
run = "scripts/test-kthw.sh"

[tasks.prowler]
description = "Prowler FedRAMP Moderate, NIST 800-53 r5 and CIS 7.0 checks against the target, exceptions muted"
run = "scripts/prowler.sh"

[tasks.lint]
description = "Static checks: terraform fmt and validate, tflint (AWS ruleset), checkov"
run = "scripts/lint.sh"
